suite: experimental supervisor deployment
templates:
  - templates/experimental-supervisor.yaml
  - templates/gateway-config.yaml
release:
  name: openshell
  namespace: gateway
tests:
  - it: adds no supervisor by default
    template: templates/experimental-supervisor.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: deploys one session host without Kubernetes identity in the gateway namespace
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
          supervisor_image: example.com/supervisor:experiment
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: kind
          value: Deployment
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: gateway
        documentIndex: 0
      - equal:
          path: spec.replicas
          value: 1
        documentIndex: 0
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: openshell-experimental-supervisor
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/supervisor:experiment
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - experimental-host
            - --health-socket
            - /run/openshell/health.sock
            - --session-control-listen
            - 0.0.0.0:5501
            - --session-control-tls-dir
            - /etc/openshell/session-control
            - --runtime-listen
            - 0.0.0.0:5500
            - --session-root
            - /run/openshell/sessions
        documentIndex: 0
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENSHELL_ENDPOINT
            value: https://openshell.gateway.svc.cluster.local:8080
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENSHELL_GATEWAY_TLS_SERVER_NAME
            value: openshell.gateway.svc.cluster.local
        documentIndex: 0
      - contains:
          path: spec.template.spec.volumes
          content:
            name: session-control
            secret:
              secretName: openshell-experimental-supervisor-control
        documentIndex: 0
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gateway-ca
            secret:
              secretName: openshell-client-tls
              items:
                - key: ca.crt
                  path: ca.crt
        documentIndex: 0
      - equal:
          path: kind
          value: Service
        documentIndex: 1
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: openshell-experimental-supervisor
            app.kubernetes.io/instance: openshell
            app.kubernetes.io/component: experimental-supervisor
        documentIndex: 1
      - equal:
          path: kind
          value: NetworkPolicy
        documentIndex: 2
      - equal:
          path: spec.ingress[0]
          value:
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: openshell
                    app.kubernetes.io/instance: openshell
            ports:
              - protocol: TCP
                port: 5501
        documentIndex: 2
      - equal:
          path: spec.ingress[1]
          value:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: gateway
                podSelector:
                  matchLabels:
                    openshell.ai/boundary-role: workload
            ports:
              - protocol: TCP
                port: 5500
        documentIndex: 2
  - it: admits runtimes only from this gateway's managed namespaces
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
          workspace_mode: managed
          gateway_id: gw-a
    asserts:
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector
          value:
            matchLabels:
              openshell.ai/managed-by: openshell
              openshell.ai/gateway-id: gw-a
        documentIndex: 2
  - it: admits runtimes only from operator-labeled namespaces
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
          workspace_mode: operator
          operator_namespace_label: example.com/openshell-workspace=true
    asserts:
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector
          value:
            matchLabels:
              example.com/openshell-workspace: "true"
        documentIndex: 2
  - it: rejects operator namespace selectors it cannot scope
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
          workspace_mode: operator
          operator_namespace_file: /etc/openshell/namespaces
    asserts:
      - failedTemplate:
          errorMessage: experimental_supervisor_topology=gateway in operator workspace mode requires operator_namespace_label of the form key=value
  - it: keeps a distinct name when the release fullname leaves no room for the suffix
    template: templates/experimental-supervisor.yaml
    set:
      fullnameOverride: openshell-gateway-release-with-a-very-long-name-0052
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^openshell-gateway-release-with-[0-9a-f]{8}-experimental-supervisor$
        documentIndex: 1
      - notEqual:
          path: metadata.name
          value: openshell-gateway-release-with-a-very-long-name-0052
        documentIndex: 1
  - it: omits the gateway CA when gateway TLS is disabled
    template: templates/experimental-supervisor.yaml
    set:
      server:
        disableTls: true
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENSHELL_TLS_CA
            value: /var/run/secrets/openshell-tls/ca.crt
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENSHELL_ENDPOINT
            value: http://openshell.gateway.svc.cluster.local:8080
        documentIndex: 0
  - it: renders the chart-owned shared supervisor connection into gateway TOML
    template: templates/gateway-config.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
    asserts:
      - matchRegex:
          path: data["gateway.toml"]
          pattern: 'experimental_supervisor_topology = "gateway"'
      - matchRegex:
          path: data["gateway.toml"]
          pattern: 'experimental_shared_supervisor = \{ control_port = 5501, control_tls_dir = "/etc/openshell-tls/experimental-supervisor-control", runtime_port = 5500, service_name = "openshell-experimental-supervisor", service_namespace = "gateway" \}'
  - it: rejects a hand-written shared supervisor connection
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
          experimental_shared_supervisor:
            service_name: elsewhere
    asserts:
      - failedTemplate:
          errorMessage: experimental_shared_supervisor is rendered by the chart; set only experimental_supervisor_topology
  - it: rejects settings the shared supervisor cannot isolate
    template: templates/experimental-supervisor.yaml
    set:
      upstreamProxy:
        url: http://proxy.example:3128
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
    asserts:
      - failedTemplate:
          errorMessage: experimental_supervisor_topology=gateway does not support upstream proxy settings or provider SPIFFE identity
  - it: rejects workspace until implemented
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: workspace
    asserts:
      - failedTemplate:
          errorMessage: experimental_supervisor_topology=workspace is not implemented
  - it: rejects invalid topology
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: invalid
    asserts:
      - failedTemplate:
          errorMessage: experimental_supervisor_topology must be gateway or workspace; omit it to disable the experiment
  - it: rejects enabled topology for another compute driver
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.gateway:
          compute_driver: docker
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
    asserts:
      - failedTemplate:
          errorMessage: experimental_supervisor_topology requires the kubernetes compute driver
